# SonarQube (DataOpsBackbone, Community Build). One key per stream:
#   spcs-rstudio           main on GitHub (official record)
#   spcs-rstudio-local-pr  pull requests
#   spcs-rstudio-local     local / act runs (default here)
# local-ci/sonar-self-scan.sh overrides key, name, and report paths.
sonar.projectKey=spcs-rstudio-local
sonar.projectName=spcs-rstudio (self-scan)
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=coverage/**,local-ci/logs/**,.snowflake/**,.scannerwork/**
# R has no Sonar analyzer: index the files so lintr issues and coverage attach
sonar.import_unknown_files=true

# Reviewed suppressions (each needs a justification)
sonar.issue.ignore.multicriteria=root,granttable
# docker:S6471 root default user: rocker's s6-overlay /init must run as PID 1
# root; rserver drops to rstudio-server and sessions run as rstudio. Same
# exception as .trivyignore DS-0002, verified by tests/smoke.sh.
sonar.issue.ignore.multicriteria.root.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.root.resourceKey=Dockerfile
# txt "IF NOT EXISTS" rule is a line regex; in the admin script it matches the
# privilege name in the schema-level GRANT [CALLER] statements, not a table DDL.
sonar.issue.ignore.multicriteria.granttable.ruleKey=txt:Disallow_CREATE_TABLE_without_IF_NOT_EXISTS_or_REPLACE
sonar.issue.ignore.multicriteria.granttable.resourceKey=sql/admin/00_setup_roles.sql
